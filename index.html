<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConDIVISAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fuente más limpia y elegante (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* Aplicando la nueva fuente */
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* Ocultar flechas de incremento/decremento en input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Estilos legibles para opciones de los desplegables */
        select option {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            padding: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <!-- Reducido font-black a font-bold para mayor elegancia -->
                <h1 class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-coins text-amber-400"></i> ConDIVISAS
                </h1>
                <p class="text-xs text-slate-400 font-medium mt-1">Cotizaciones en tiempo real</p>
            </div>
        </div>

        <form id="converterForm" class="space-y-4" onsubmit="event.preventDefault();">
            
            <!-- Campo Divisa Origen -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Monto a Convertir</label>
                <div class="relative flex items-center bg-slate-800 border border-slate-700/80 rounded-2xl focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all overflow-hidden">
                    <!-- Reducido font-extrabold a font-bold -->
                    <input type="number" id="amount" value="100" min="0" step="any" placeholder="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-24 text-2xl font-bold text-white focus:outline-none">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 shadow-inner">
                        <!-- Reducido text-sm a text-xs para que sea levemente más pequeño -->
                        <select id="fromCurrency" class="bg-transparent text-xs font-bold text-indigo-400 focus:outline-none cursor-pointer">
                            <!-- Opciones cargadas con abreviaciones -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Botón para Invertir Conversión con Flechas Verticales -->
            <div class="flex justify-center -my-2 relative z-10">
                <button type="button" id="swapBtn" title="Invertir divisas" class="bg-slate-800 hover:bg-indigo-600 text-indigo-400 hover:text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg border-2 border-slate-900 active:scale-90 transition-all cursor-pointer">
                    <i class="fa-solid fa-arrows-up-down text-base"></i>
                </button>
            </div>

            <!-- Campo Divisa Destino -->
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Resultado Convertido</label>
                <div class="relative flex items-center bg-slate-800/80 border border-slate-700/80 rounded-2xl transition-all overflow-hidden">
                    <!-- Reducido font-extrabold a font-bold -->
                    <input type="text" id="resultAmount" readonly value="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-24 text-2xl font-bold text-emerald-400 focus:outline-none cursor-default">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 shadow-inner">
                        <!-- Reducido text-sm a text-xs para que sea levemente más pequeño -->
                        <select id="toCurrency" class="bg-transparent text-xs font-bold text-emerald-400 focus:outline-none cursor-pointer">
                            <!-- Opciones cargadas con abreviaciones -->
                        </select>
                    </div>
                </div>
            </div>

            <div class="pt-2 flex justify-between items-center text-xs text-slate-400">
                <span id="rateInfo" class="font-medium">Cargando cotización...</span>
                <button type="button" id="refreshBtn" class="hover:text-indigo-400 transition-colors p-1 cursor-pointer" title="Actualizar cotizaciones">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

        </form>
    </div>

    <script>
        // Lista simplificada ya que no necesitamos las palabras clave del dictado por voz
        const currencies = ["USD", "ARS", "CLP", "EUR", "BRL", "MXN", "UYU", "COP", "GBP"];

        let ratesData = {};

        // Referencias a los elementos del DOM
        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const amountInput = document.getElementById('amount');
        const resultInput = document.getElementById('resultAmount');
        const swapBtn = document.getElementById('swapBtn');
        const rateInfo = document.getElementById('rateInfo');
        const refreshBtn = document.getElementById('refreshBtn');

        // Rellena los selectores con las divisas
        function populateSelects() {
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';
            currencies.forEach(code => {
                fromSelect.innerHTML += `<option value="${code}">${code}</option>`;
                toSelect.innerHTML += `<option value="${code}">${code}</option>`;
            });

            fromSelect.value = 'USD';
            toSelect.value = 'ARS';
        }

        // Obtiene las tasas de conversión de la API
        async function fetchRates() {
            try {
                rateInfo.textContent = "Actualizando tasas...";
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                ratesData = data.rates;
                calculateConversion();
            } catch (err) {
                rateInfo.textContent = "Error al conectar con el servidor.";
            }
        }

        // Calcula el resultado de la conversión
        function calculateConversion() {
            const amount = parseFloat(amountInput.value);
            const from = fromSelect.value;
            const to = toSelect.value;

            // Manejo de valores no válidos
            if (isNaN(amount) || amount <= 0) {
                resultInput.value = "0.00";
                rateInfo.textContent = `1 ${from} = -- ${to}`;
                return;
            }

            // Esperar a que lleguen los datos
            if (!ratesData || !ratesData[from] || !ratesData[to]) {
                return;
            }

            const fromRate = ratesData[from];
            const toRate = ratesData[to];
            
            // Fórmula cruzada (pasando por el USD base)
            const converted = (amount / fromRate) * toRate;
            const unitRate = (1 / fromRate) * toRate;

            // Formatear resultados
            resultInput.value = converted.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            rateInfo.textContent = `1 ${from} = ${unitRate.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 4 })} ${to}`;
        }

        // Event Listeners
        amountInput.addEventListener('input', calculateConversion);
        fromSelect.addEventListener('change', calculateConversion);
        toSelect.addEventListener('change', calculateConversion);

        // Invertir Divisas
        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            calculateConversion();
        });

        // Refrescar cotizaciones
        refreshBtn.addEventListener('click', fetchRates);

        // Inicialización al cargar la ventana
        window.onload = () => {
            populateSelects();
            fetchRates();
        };
    </script>
</body>
</html>
