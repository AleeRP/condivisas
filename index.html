<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConDIVISAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* Ocultar flechas de incremento/decremento en input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Estilos legibles para opciones de los desplegables */
        select option {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            padding: 10px;
            font-weight: 700;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .mic-active {
            animation: pulse-ring 1.4s infinite;
            background-color: #ef4444 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-coins text-amber-400"></i> ConDIVISAS
                </h1>
                <p class="text-xs text-slate-400 font-medium">Cotizaciones en tiempo real</p>
            </div>
            <!-- Botón de Micrófono -->
            <button id="micBtn" type="button" class="w-12 h-12 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition-all active:scale-95 cursor-pointer" title="Presionar para hablar">
                <i id="micIcon" class="fa-solid fa-microphone text-lg"></i>
            </button>
        </div>

        <!-- Estado de Voz -->
        <div id="voiceStatus" class="mb-5 p-3 rounded-2xl bg-slate-800/90 border border-slate-700/60 hidden text-center transition-all">
            <p id="voiceText" class="text-xs font-semibold text-amber-300">Escuchando... habla ahora</p>
        </div>

        <form id="converterForm" class="space-y-4" onsubmit="event.preventDefault();">
            
            <!-- Campo Divisa Origen -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Monto a Convertir</label>
                <div class="relative flex items-center bg-slate-800 border border-slate-700/80 rounded-2xl focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all overflow-hidden">
                    <input type="number" id="amount" value="100" min="0" step="any" placeholder="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-24 text-2xl font-extrabold text-white focus:outline-none">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 shadow-inner">
                        <select id="fromCurrency" class="bg-transparent text-sm font-black text-indigo-400 focus:outline-none cursor-pointer">
                            <!-- Opciones cargadas con abreviaciones -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Botón para Invertir Conversión con Flechas Verticales -->
            <div class="flex justify-center -my-2 relative z-10">
                <button type="button" id="swapBtn" title="Invertir divisas" class="bg-slate-800 hover:bg-indigo-600 text-indigo-400 hover:text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg border-2 border-slate-900 active:scale-90 transition-all cursor-pointer">
                    <i class="fa-solid fa-arrows-up-down text-base"></i>
                </button>
            </div>

            <div class="space-y-1.5">

        };
    </script>
</body>
</html>
