<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConDIVISAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* Ocultar flechas de incremento/decremento en input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Estilos legibles para opciones de los desplegables */
        select option {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            padding: 10px;
            font-weight: 600;
        }

        /* Scrollbar elegante */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        /* Transición suave para ocultar el Splash Screen */
        #splashScreen {
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
        }
        #splashScreen.splash-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ANIMACIONES DE COLISIÓN DE MONEDAS EN EL SPLASH SCREEN */
        @keyframes coinDrop {
            0% { transform: translateY(-45vh) rotate(-180deg) scale(0.5); opacity: 0; }
            55% { transform: translateY(0) rotate(0deg) scale(1.1); opacity: 1; }
            63% { transform: translateY(0) scale(0); opacity: 0; }
            100% { transform: translateY(0) scale(0); opacity: 0; }
        }

        @keyframes coinRise {
            0% { transform: translateY(45vh) rotate(180deg) scale(0.5); opacity: 0; }
            55% { transform: translateY(0) rotate(0deg) scale(1.1); opacity: 1; }
            63% { transform: translateY(0) scale(0); opacity: 0; }
            100% { transform: translateY(0) scale(0); opacity: 0; }
        }

        @keyframes shockwaveRing {
            0%, 58% { transform: scale(0); opacity: 0; }
            63% { transform: scale(0.3); opacity: 1; border-width: 6px; }
            100% { transform: scale(3.5); opacity: 0; border-width: 1px; }
        }

        @keyframes logoReveal {
            0%, 60% { transform: scale(0) rotate(-15deg); opacity: 0; }
            80% { transform: scale(1.12) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes textGlide {
            0%, 75% { transform: translateY(18px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .anim-coin-top {
            animation: coinDrop 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .anim-coin-bottom {
            animation: coinRise 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .anim-shockwave {
            animation: shockwaveRing 1.2s ease-out forwards;
        }
        .anim-logo-badge {
            animation: logoReveal 1.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .anim-splash-text {
            animation: textGlide 1.4s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950">

    <!-- Pantalla de Inicio / Splash Screen -->
    <div id="splashScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 select-none overflow-hidden">
        
        <!-- Escenario de Animación de Colisión -->
        <div class="relative w-36 h-36 flex items-center justify-center mb-5">
            
            <!-- Onda de choque en el punto del impacto -->
            <div class="absolute w-24 h-24 rounded-full border-amber-400/80 anim-shockwave"></div>
            
            <!-- Moneda 1: Ficha Dorada (baja desde arriba) -->
            <div class="absolute z-20 anim-coin-top flex items-center justify-center">
                <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-amber-600 to-amber-300 border-2 border-amber-200 flex items-center justify-center shadow-[0_0_20px_rgba(251,191,36,0.6)]">
                    <i class="fa-solid fa-dollar-sign text-slate-950 text-2xl font-black"></i>
                </div>
            </div>
            
            <!-- Moneda 2: Ficha Índigo/Azul (sube desde abajo, misma dimensión simétrica) -->
            <div class="absolute z-20 anim-coin-bottom flex items-center justify-center">
                <div class="w-14 h-14 rounded-full bg-gradient-to-tr from-indigo-700 to-indigo-400 border-2 border-indigo-200 flex items-center justify-center shadow-[0_0_20px_rgba(99,102,241,0.6)]">
                    <i class="fa-solid fa-dollar-sign text-white text-2xl font-black"></i>
                </div>
            </div>

            <!-- Logo emergente tras la colisión -->
            <div class="anim-logo-badge w-24 h-24 bg-slate-900 border border-slate-800 rounded-3xl flex items-center justify-center shadow-2xl shadow-indigo-500/20 relative overflow-hidden z-10">
                <div class="absolute inset-0 bg-gradient-to-tr from-indigo-600/30 to-amber-500/20 rounded-3xl"></div>
                <i class="fa-solid fa-coins text-amber-400 text-5xl relative z-10"></i>
            </div>
        </div>

        <!-- Título y Subtítulo emergentes -->
        <div class="anim-splash-text text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight flex items-center justify-center gap-2">
                ConDIVISAS
            </h1>
            <p class="text-xs text-slate-400 font-medium mt-1">Cotizaciones en tiempo real</p>
        </div>

        <!-- Cartel de carga inferior -->
        <div class="anim-splash-text absolute bottom-12 flex items-center gap-2.5 text-xs text-slate-500 font-medium bg-slate-900/60 border border-slate-800/80 px-4 py-2 rounded-full">
            <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i>
            <span>Iniciando...</span>
        </div>
    </div>

    <!-- Contenedor Principal de la App -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-coins text-amber-400"></i> ConDIVISAS
                </h1>
                <p class="text-xs text-slate-400 font-medium">Cotizaciones en tiempo real</p>
            </div>
        </div>

        <form id="converterForm" class="space-y-4" onsubmit="event.preventDefault();">
            
            <!-- Campo Divisa Origen -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">CONVERTIR</label>
                <div class="relative flex items-center bg-slate-800 border border-slate-700/80 rounded-2xl focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all overflow-hidden">
                    <input type="number" id="amount" value="100" min="0" step="any" placeholder="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-24 text-2xl font-bold text-white focus:outline-none">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 shadow-inner">
                        <select id="fromCurrency" class="bg-transparent text-xs font-bold text-indigo-400 focus:outline-none cursor-pointer">
                            <!-- Carga dinámica -->
                        </select>
                    </div>
                </div>
                <p id="fromLabel" class="text-[11px] text-slate-400 pl-1 font-medium"></p>
            </div>

            <!-- Botón para Invertir Conversión -->
            <div class="flex justify-center -my-2 relative z-10">
                <button type="button" id="swapBtn" title="Invertir divisas" class="bg-slate-800 hover:bg-indigo-600 text-indigo-400 hover:text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg border-2 border-slate-900 active:scale-90 transition-all cursor-pointer">
                    <i class="fa-solid fa-arrows-up-down text-base"></i>
                </button>
            </div>

            <!-- Campo Divisa Destino -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">RESULTADO</label>
                <div class="relative flex items-center bg-slate-800/80 border border-slate-700/80 rounded-2xl transition-all overflow-hidden">
                    <input type="text" id="resultAmount" readonly value="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-24 text-2xl font-bold text-emerald-400 focus:outline-none cursor-default">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-1.5 shadow-inner">
                        <select id="toCurrency" class="bg-transparent text-xs font-bold text-emerald-400 focus:outline-none cursor-pointer">
                            <!-- Carga dinámica -->
                        </select>
                    </div>
                </div>
                <p id="toLabel" class="text-[11px] text-slate-400 pl-1 font-medium"></p>
            </div>

            <!-- Pie de tarjeta -->
            <div class="pt-2 flex justify-between items-center text-xs text-slate-400">
                <span id="rateInfo" class="font-medium">Cargando cotización...</span>
                <button type="button" id="refreshBtn" class="hover:text-indigo-400 transition-colors p-1 cursor-pointer" title="Actualizar cotizaciones">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

        </form>
    </div>

    <script>
        const currencies = [
            { code: "USD", name: "Dólar estadounidense" },
            { code: "EUR", name: "Euro" },
            { code: "ARS", name: "Peso argentino (Blue)" },
            { code: "BOB", name: "Boliviano" },
            { code: "BRL", name: "Real brasileño" },
            { code: "CAD", name: "Dólar canadiense" },
            { code: "CHF", name: "Franco suizo" },
            { code: "CLP", name: "Peso chileno" },
            { code: "COP", name: "Peso colombiano" },
            { code: "GBP", name: "Libra esterlina" },
            { code: "HKD", name: "Dólar de Hong Kong" },
            { code: "JPY", name: "Yen japonés" },
            { code: "MXN", name: "Peso mexicano" },
            { code: "PEN", name: "Sol peruano" },
            { code: "PYG", name: "Guaraní paraguayo" },
            { code: "SGD", name: "Dólar de Singapur" },
            { code: "UYU", name: "Peso uruguayo" }
        ];

        let ratesData = {};
        let splashStartTime = Date.now();

        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const amountInput = document.getElementById('amount');
        const resultInput = document.getElementById('resultAmount');
        const swapBtn = document.getElementById('swapBtn');
        const rateInfo = document.getElementById('rateInfo');
        const refreshBtn = document.getElementById('refreshBtn');
        const fromLabel = document.getElementById('fromLabel');
        const toLabel = document.getElementById('toLabel');
        const splashScreen = document.getElementById('splashScreen');

        function hideSplashScreen() {
            const elapsedTime = Date.now() - splashStartTime;
            const remainingDelay = Math.max(0, 1800 - elapsedTime);

            setTimeout(() => {
                if (splashScreen) {
                    splashScreen.classList.add('splash-hidden');
                }
            }, remainingDelay);
        }

        function populateSelects() {
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';
            currencies.forEach(c => {
                fromSelect.innerHTML += `<option value="${c.code}">${c.code}</option>`;
                toSelect.innerHTML += `<option value="${c.code}">${c.code}</option>`;
            });

            fromSelect.value = 'USD';
            toSelect.value = 'ARS';
            updateDescriptions();
        }

        function updateDescriptions() {
            const fromObj = currencies.find(c => c.code === fromSelect.value);
            const toObj = currencies.find(c => c.code === toSelect.value);

            if (fromObj) fromLabel.textContent = fromObj.name;
            if (toObj) toLabel.textContent = toObj.name;
        }

        async function fetchRates() {
            try {
                rateInfo.textContent = "Actualizando tasas...";
                
                // 1. Cotizaciones globales
                const resGlobal = await fetch('https://open.er-api.com/v6/latest/USD');
                const dataGlobal = await resGlobal.json();
                ratesData = dataGlobal.rates;

                // 2. Dólar Blue para Argentina
                try {
                    const resBlue = await fetch('https://dolarapi.com/v1/dolares/blue');
                    const dataBlue = await resBlue.json();
                    if (dataBlue && dataBlue.venta) {
                        ratesData['ARS'] = dataBlue.venta;
                    }
                } catch (e) {
                    console.warn("No se pudo obtener el Dólar Blue, usando el oficial.", e);
                }

                calculateConversion();
            } catch (err) {
                rateInfo.textContent = "Error al conectar con el servidor.";
            } finally {
                hideSplashScreen();
            }
        }

        function calculateConversion() {
            const amount = parseFloat(amountInput.value);
            const from = fromSelect.value;
            const to = toSelect.value;

            updateDescriptions();

            if (isNaN(amount) || amount <= 0) {
                resultInput.value = "0.00";
                rateInfo.textContent = `1 ${from} = -- ${to}`;
                return;
            }

            if (!ratesData || !ratesData[from] || !ratesData[to]) {
                return;
            }

            const fromRate = ratesData[from];
            const toRate = ratesData[to];
            const converted = (amount / fromRate) * toRate;
            const unitRate = (1 / fromRate) * toRate;

            resultInput.value = converted.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            rateInfo.textContent = `1 ${from} = ${unitRate.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 4 })} ${to}`;
        }

        amountInput.addEventListener('input', calculateConversion);
        fromSelect.addEventListener('change', calculateConversion);
        toSelect.addEventListener('change', calculateConversion);

        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            calculateConversion();
        });

        refreshBtn.addEventListener('click', fetchRates);

        window.onload = () => {
            populateSelects();
            fetchRates();
        };
    </script>
</body>
</html>
