<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConDIVISAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
        }

        /* Ocultar flechas de incremento/decremento en input number */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Estilos legibles para opciones de los desplegables */
        select option {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            padding: 10px;
            font-weight: 700;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .mic-active {
            animation: pulse-ring 1.4s infinite;
            background-color: #ef4444 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-950">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative my-auto">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    <i class="fa-solid fa-coins text-amber-400"></i> ConDIVISAS
                </h1>
                <p class="text-xs text-slate-400 font-medium">Cotizaciones en tiempo real</p>
            </div>
            <!-- Botón de Micrófono -->
            <button id="micBtn" type="button" class="w-12 h-12 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg transition-all active:scale-95 cursor-pointer" title="Presionar para hablar">
                <i id="micIcon" class="fa-solid fa-microphone text-lg"></i>
            </button>
        </div>

        <!-- Estado de Voz -->
        <div id="voiceStatus" class="mb-5 p-3 rounded-2xl bg-slate-800/90 border border-slate-700/60 hidden text-center transition-all">
            <p id="voiceText" class="text-xs font-semibold text-amber-300">Escuchando... habla ahora</p>
        </div>

        <form id="converterForm" class="space-y-4" onsubmit="event.preventDefault();">
            
            <!-- Campo Divisa Origen -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Monto a Convertir</label>
                <div class="relative flex items-center bg-slate-800 border border-slate-700/80 rounded-2xl focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/20 transition-all overflow-hidden">
                    <input type="number" id="amount" value="100" min="0" step="any" placeholder="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-28 text-2xl font-extrabold text-white focus:outline-none">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 shadow-inner">
                        <select id="fromCurrency" class="bg-transparent text-sm font-black text-indigo-400 focus:outline-none cursor-pointer">
                        </select>
                    </div>
                </div>
            </div>

            <!-- Botón para Invertir Conversión con Flechas Verticales -->
            <div class="flex justify-center -my-2 relative z-10">
                <button type="button" id="swapBtn" title="Invertir divisas" class="bg-slate-800 hover:bg-indigo-600 text-indigo-400 hover:text-white w-11 h-11 rounded-full flex items-center justify-center shadow-lg border-2 border-slate-900 active:scale-90 transition-all cursor-pointer">
                    <i class="fa-solid fa-arrows-up-down text-base"></i>
                </button>
            </div>

            <!-- Campo Divisa Destino -->
            <div class="space-y-1.5">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Resultado Convertido</label>
                <div class="relative flex items-center bg-slate-800/80 border border-slate-700/80 rounded-2xl transition-all overflow-hidden">
                    <input type="text" id="resultAmount" readonly value="0.00" 
                        class="w-full bg-transparent py-4 pl-4 pr-28 text-2xl font-extrabold text-emerald-400 focus:outline-none cursor-default">
                    
                    <div class="absolute right-2 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 shadow-inner">
                        <select id="toCurrency" class="bg-transparent text-sm font-black text-emerald-400 focus:outline-none cursor-pointer">
                        </select>
                    </div>
                </div>
            </div>

            <div class="pt-2 flex justify-between items-center text-xs text-slate-400">
                <span id="rateInfo" class="font-medium">Cargando cotización...</span>
                <button type="button" id="refreshBtn" class="hover:text-indigo-400 transition-colors p-1 cursor-pointer" title="Actualizar cotizaciones">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

        </form>
    </div>

    <script>
        const currencies = [
            { code: "USD", keywords: ["dólares", "dólar", "dolares", "dolar", "usd"] },
            { code: "ARS", keywords: ["pesos argentinos", "peso argentino", "pesos", "peso", "ars", "argentinos"] },
            { code: "CLP", keywords: ["pesos chilenos", "peso chileno", "chilenos", "clp"] },
            { code: "EUR", keywords: ["euros", "euro", "eur"] },
            { code: "BRL", keywords: ["reales", "real", "brl"] },
            { code: "MXN", keywords: ["pesos mexicanos", "peso mexicano", "mexicanos", "mxn"] },
            { code: "UYU", keywords: ["pesos uruguayos", "peso uruguayo", "uruguayos", "uyu"] },
            { code: "COP", keywords: ["pesos colombianos", "peso colombiano", "colombianos", "cop"] },
            { code: "GBP", keywords: ["libras", "libra", "gbp"] }
        ];

        let ratesData = {};
        let recognition = null;
        let isListening = false;
        let activeStream = null;

        const fromSelect = document.getElementById('fromCurrency');
        const toSelect = document.getElementById('toCurrency');
        const amountInput = document.getElementById('amount');
        const resultInput = document.getElementById('resultAmount');
        const swapBtn = document.getElementById('swapBtn');
        const rateInfo = document.getElementById('rateInfo');
        const refreshBtn = document.getElementById('refreshBtn');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceText = document.getElementById('voiceText');

        function populateSelects() {
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';
            currencies.forEach(c => {
                fromSelect.innerHTML += `<option value="${c.code}">${c.code}</option>`;
                toSelect.innerHTML += `<option value="${c.code}">${c.code}</option>`;
            });

            fromSelect.value = 'USD';
            toSelect.value = 'ARS';
        }

        async function fetchRates() {
            try {
                rateInfo.textContent = "Actualizando tasas...";
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                ratesData = data.rates;
                calculateConversion();
            } catch (err) {
                rateInfo.textContent = "Error al conectar con el servidor.";
            }
        }

        function calculateConversion() {
            const amount = parseFloat(amountInput.value);
            const from = fromSelect.value;
            const to = toSelect.value;

            if (isNaN(amount) || amount <= 0) {
                resultInput.value = "0.00";
                rateInfo.textContent = `1 ${from} = -- ${to}`;
                return;
            }

            if (!ratesData || !ratesData[from] || !ratesData[to]) {
                return;
            }

            const fromRate = ratesData[from];
            const toRate = ratesData[to];
            const converted = (amount / fromRate) * toRate;
            const unitRate = (1 / fromRate) * toRate;

            resultInput.value = converted.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            rateInfo.textContent = `1 ${from} = ${unitRate.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 4 })} ${to}`;
        }

        function showVoiceMessage(msg, isError = false) {
            voiceStatus.classList.remove('hidden');
            voiceText.textContent = msg;
            voiceText.className = isError ? "text-xs font-semibold text-red-400" : "text-xs font-semibold text-amber-300";
        }

        function stopMicrophone() {
            isListening = false;
            micBtn.classList.remove('mic-active');
            micIcon.className = 'fa-solid fa-microphone text-lg';

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            if (activeStream) {
                activeStream.getTracks().forEach(track => track.stop());
                activeStream = null;
            }

            setTimeout(() => {
                if (!isListening) voiceStatus.classList.add('hidden');
            }, 4000);
        }

        async function startListening() {
            const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechClass) {
                showVoiceMessage("Tu navegador no soporta el micrófono integrado.", true);
                return;
            }

            try {
                activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                showVoiceMessage("Debes otorgar permiso de micrófono en tu celular.", true);
                return;
            }

            recognition = new SpeechClass();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('mic-active');
                micIcon.className = 'fa-solid fa-microphone-lines text-lg';
                showVoiceMessage("Escuchando... habla ahora (ej: 100 dólares a pesos)");
            };

            recognition.onresult = (event) => {
                let currentText = "";
                for (let i = 0; i < event.results.length; i++) {
                    currentText += event.results[i][0].transcript;
                }
                showVoiceMessage(`Procesando: "${currentText}"`);
                parseVoiceCommand(currentText.toLowerCase());
            };

            recognition.onerror = (e) => {
                if (e.error === 'no-speech') {
                    showVoiceMessage("No se detectó voz. Vuelve a intentarlo.", true);
                } else {
                    showVoiceMessage("Error en micrófono: " + e.error, true);
                }
                stopMicrophone();
            };

            recognition.onend = () => {
                stopMicrophone();
            };

            try {
                recognition.start();
            } catch (err) {
                showVoiceMessage("No se pudo iniciar el dictado.", true);
                stopMicrophone();
            }
        }

        function parseVoiceCommand(text) {
            let num = null;
            const wordNumbers = {
                "un": 1, "uno": 1, "dos": 2, "tres": 3, "cuatro": 4, "cinco": 5,
                "diez": 10, "veinte": 20, "cincuenta": 50, "cien": 100, "ciento": 100,
                "quinientos": 500, "mil": 1000
            };

            const numMatch = text.match(/\d+([.,]\d+)?/);
            if (numMatch) {
                num = parseFloat(numMatch[0].replace(',', '.'));
            } else {
                for (let word in wordNumbers) {
                    if (text.includes(word)) {
                        num = wordNumbers[word];
                        break;
                    }
                }
            }

            if (num && !isNaN(num)) {
                amountInput.value = num;
            }

            let foundFrom = null;
            let foundTo = null;

            const parts = text.split(/\b(a|en|por)\b/i);

            if (parts.length >= 3) {
                foundFrom = findCurrencyMatch(parts[0]);
                foundTo = findCurrencyMatch(parts.slice(2).join(' '));
            } else {
                const matches = [];
                currencies.forEach(c => {
                    c.keywords.forEach(kw => {
                        if (text.includes(kw)) {
                            matches.push({ code: c.code, idx: text.indexOf(kw) });
                        }
                    });
                });
                matches.sort((a, b) => a.idx - b.idx);
                if (matches.length >= 2) {
                    foundFrom = matches[0].code;
                    foundTo = matches[1].code;
                } else if (matches.length === 1) {
                    foundTo = matches[0].code;
                }
            }

            if (foundFrom) fromSelect.value = foundFrom;
            if (foundTo) toSelect.value = foundTo;

            calculateConversion();
        }

        function findCurrencyMatch(subText) {
            for (const c of currencies) {
                for (const kw of c.keywords) {
                    if (subText.includes(kw)) return c.code;
                }
            }
            return null;
        }

        micBtn.addEventListener('click', () => {
            if (isListening) {
                stopMicrophone();
            } else {
                startListening();
            }
        });

        amountInput.addEventListener('input', calculateConversion);
        fromSelect.addEventListener('change', calculateConversion);
        toSelect.addEventListener('change', calculateConversion);

        swapBtn.addEventListener('click', () => {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            calculateConversion();
        });

        refreshBtn.addEventListener('click', fetchRates);

        window.onload = () => {
            populateSelects();
            fetchRates();
        };
    </script>
</body>
</html>
